name: TEVI OCR printed regression
on:
  push:
    branches:
      - feat/printed-document-layout-pipeline-20261026
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm run check
      - run: npm run benchmark:final
      - run: ./node_modules/.bin/tsx scripts/inspect-geometry-regression.ts
      - run: python3 -m py_compile experiments/ppstructure_v3_compare.py